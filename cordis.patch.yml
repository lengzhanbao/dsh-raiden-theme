# Raiden Inazuma Atelier: insert the theme plugin only.
# Do not replace agent-presets config — that would drop shipped standard/minimal/code/cordis.
# The Raiden agent composition lives in this package's presets/raiden and is also
# installed under $DSH_HOME/.agent-presets/raiden (user root).
- insert:
    - id: dsh-raiden-theme
      name: '@dsh-external/dsh-raiden-theme'
      config: {}
